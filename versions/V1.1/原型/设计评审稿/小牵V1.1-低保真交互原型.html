function endTouch(event,drop){

 if(target?.dataset.drag!==active.type)return;
 const preventClick=e=>{e.stopImmediatePropagation();e.preventDefault()};
 $("app").addEventListener("click",preventClick,{capture:true,once:true});

}

function newFormal(){const t=clone(edit),live=data.trips.find(x=>x.id===t.id);t.status=original?(live?.status||original.status):"待出发";if(original&&live){t.prep=clone(live.prep);t.records=clone(live.records);const ids=new Set(allStops(t).map(s=>s.id));t.records.forEach(r=>{if(!ids.has(r.stop))r.stop=""})}return t}
function hasConflict(t){const mins=s=>{const [h,m]=s.split(":").map(Number);return h*60+m};return t.days.some(day=>day.slice(1).some((s,i)=>{const a=day[i],l=legInfo(a,s);return a.time&&s.time&&mins(s.time)<mins(a.time)+Number(a.stay)+l.mins[l.mode]}))}
function finishEdit(){if(!edit.title.trim()||!edit.city.trim()||!edit.date)return toast("请补全标题、目的地和出发日期");if(!allStops(edit).length)return toast("至少添加一个地点");if(allStops(edit).some(s=>!s.time))return toast("请完善地点的预计到达时间");const t=newFormal();const submit=()=>{if(!commit(()=>{updateTrip(t);delete data.edits[t.id]}))return;leaveEditor(t);toast(hasConflict(t)?"已保存，部分地点时间冲突":"已保存行程")};if(original&&data.edits[t.id]&&editOrigin!=="draft")sheet("完成编辑并删除旧草稿？",()=>`<p>正式行程保存成功后删除旧编辑草稿。</p>${btn("返回检查",close,"btn",true)} ${primary("完成编辑并删除旧草稿",submit,true)}`);else submit()}
function saveEditDraft(){if(!original){const t=clone(edit);t.status="草稿";if(!commit(()=>updateTrip(t)))return;replace("list",{filter:"草稿"});return}const stash=()=>{if(!commit(()=>{data.edits[edit.id]=clone(edit)}))return;leaveEditor(original)};sheet("保存编辑进度",()=>`<div class="stack">${btn("保存到原行程",()=>{const t=newFormal();if(commit(()=>updateTrip(t)))leaveEditor(t)},"btn",true)}${btn("另存为编辑草稿",()=>{if(editOrigin!=="draft"&&data.edits[edit.id])confirmBox("覆盖旧草稿？","当前路线将替换附属草稿。","覆盖旧草稿",stash);else stash()},"btn",true)}${btn("取消",close,"btn",true)}</div>`)}
function previewRoute(d){const legs=edit.days.flatMap(day=>day.slice(1).map((s,i)=>legInfo(day[i],s)));sheet("路线预览",()=>`${map(edit,d,false,true)}<p>${edit.days.length} 天 · ${allStops(edit).length} 站 · 约 ${legs.reduce((n,l)=>n+l.base,0).toFixed(1)} km · ${legs.reduce((n,l)=>n+l.mins[l.mode],0)} 分钟</p><small>交通图例　${modes.join("／")}</small>${dayTabs(edit,d,previewRoute,null,true)}<details open><summary>第 ${d+1} 天地点与交通</summary>${timeline(edit,d,"preview",true)}</details>`)}
function selectedRecords(){const current=data.trips.find(t=>t.id===pub.trip.id);const allowed=new Set((current?.records||[]).filter(r=>!r.draft&&r.visibility==="公开").map(r=>r.id));return pub.selected.map(k=>pubRecords().find(r=>r.id===k)).filter(r=>r&&allowed.has(r.id))}
function saveWorkDraft(){if(!commit(()=>{data.drafts=data.drafts.filter(d=>d.id!==pub.id);data.drafts.unshift(clone(pub))}))return;pop();toast("作品草稿已保存")}
function publishWork(){if(!allStops(pub.trip).length||pub.single&&!pub.spot)return toast("请先选择行程地点");const t=workSnapshot();if(!commit(()=>{if(!data.works.some(w=>w.id===pub.id))data.works.unshift(t);data.drafts=data.drafts.filter(d=>d.id!==pub.id)}))return;replace("public",{trip:t,day:0});toast("作品已发布到个人主页")}
function nativePage(){return header(page.title)+main(`<div class="box nativebox"><small>平台原生 · 本地模拟</small><h2>${esc(page.title)}</h2>${ph(page.title.includes("搜索")?"原生搜索页面占位":"原生内容位置","widepic")}${btn("返回来源",pop,"btn wide")}</div>`)}
function render(){actions=[];const views={feed:workFeed,channel,category,search,edit:editor,list:listPage,private:privatePage,public:publicPage,record:recordPage,publish:publishPage,profile,workDrafts,native:nativePage};$("app").dataset.page=page.name;$("app").innerHTML=(["list","private","public","publish","workDrafts","native","category"].includes(page.name)?status():"")+views[page.name]();if($("loc"))$("loc").onchange=e=>{page.loc=e.target.value;page.query="";render()};$("reviewName").textContent=pageNames[page.name];$("reviewNote").textContent=pageNotes[page.name];renderModal()}


render();
</script></html>
