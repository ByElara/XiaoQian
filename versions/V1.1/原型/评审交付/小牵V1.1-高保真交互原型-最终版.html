const photoUrl=name=>embeddedPhotos[name]||embeddedPhotos.tower;
const image=(name,cls="",alt="")=>`<img class="photo-render ${cls}" src="${esc(photoUrl(name))}" alt="${esc(alt)}">`;
function btn(label,fn,cls="",inModal=false,attr=""){
 const list=inModal?overlayActions:actions;
 return `<button type="button" class="${cls}" data-action="${list.push(fn)-1}" ${attr}>${label}</button>`;
}
const main=html=>`<main class="pad">${html}</main>`;
const status=(dark=false)=>`<div class="status ${dark?"dark":""}"><span>21:08</span><span>▮▮▮ ◔ ▰</span></div>`;
const header=(title,right="")=>`<header class="bar">${btn("‹",back,"back",false,'aria-label="返回"')}<strong>${esc(title)}</strong><div>${right}</div></header>`;
const foot=(...items)=>`<footer class="foot">${items.join("")}</footer>`;
const primary=(label,fn,m=false)=>btn(label,fn,"btn primary",m);
function toast(message){$("toast").textContent=message;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$("toast").textContent="",2300)}
function rerender(){const y=document.querySelector("main")?.scrollTop;render();if(y)document.querySelector("main").scrollTop=y}

function paintMaps(){document.querySelectorAll("canvas[data-map]").forEach(c=>{
 const ctx=c.getContext("2d"),w=c.width,h=c.height, names=JSON.parse(c.dataset.map);
 ctx.fillStyle="#e9e9e4";ctx.fillRect(0,0,w,h);

 ctx.strokeStyle="#fff";ctx.lineWidth=6;for(let j=0;j<12;j++){ctx.beginPath();ctx.moveTo(j*80-90,0);ctx.lineTo(j*80-170,h);ctx.stroke()}for(let j=0;j<4;j++){ctx.beginPath();ctx.moveTo(0,j*65-30);ctx.lineTo(w,j*65+45);ctx.stroke()}
 const dots=names.map((_,i)=>[95+i*(w-190)/Math.max(1,names.length-1),h*(.31+(i%2)*.20)+i*2]);
 dots.forEach(([x,y],i)=>{if(!i)return;const [a,b]=dots[i-1];ctx.beginPath();ctx.moveTo(a,b);ctx.bezierCurveTo((a+x)/2,b,(a+x)/2,y,x,y);ctx.strokeStyle="#fff";ctx.lineWidth=10;ctx.stroke();ctx.strokeStyle="#ff1856";ctx.lineWidth=5;ctx.stroke()});
 dots.forEach(([x,y],i)=>{ctx.beginPath();ctx.arc(x,y,17,0,Math.PI*2);ctx.fillStyle="#fb124f";ctx.fill();ctx.fillStyle="#fff";ctx.textAlign="center";ctx.font="bold 19px sans-serif";ctx.fillText(i+1,x,y+6);ctx.font="bold 17px Microsoft YaHei";const size=ctx.measureText(names[i]).width+15;ctx.fillStyle="#fffffff1";ctx.beginPath();ctx.roundRect(x-size/2,y+18,size,24,11);ctx.fill();ctx.fillStyle="#16161c";ctx.fillText(names[i],x,y+36)});
 if(!names.length){ctx.fillStyle="#53545d";ctx.textAlign="center";ctx.font="22px Microsoft YaHei";ctx.fillText("添加地点后显示路线",w/2,h/2)}

function legInfo(a,b){const base=a.i===0&&b.i===1?3.2:a.i===1&&b.i===2?1.6:1.2+Math.abs(a.i-b.i)*.7;

 const mins=[Math.max(8,Math.round(base*3)),Math.round(base*5.6),Math.round(base<2?base*6.25:base*12.5),Math.round(base*4.7),Math.max(8,Math.round(base*3))];
 return {base,mode,mins}
}

function channel(){const tab=page.category||"推荐";return status()+topBar("行程")+`<div class="chan"><div class="row">${btn("⌕　搜索行程、景点、城市",()=>go("search"),"searchbtn grow")}${btn("我的行程",()=>go("list"),"btn")}</div><div class="cats">${cats.map((c,i)=>btn(`<b>${["城","景","游","周","定","营"][i]}</b>${c}`,()=>go("category",{cat:c}))).join("")}</div></div>`+tabs(["推荐","附近","发现","直播"],tab,x=>set("category",x))+main(tab==="直播"?'<div class="empty">直播栏目占位 · V2</div>':`<div class="grid">${(tab==="附近"?[tile(sample),resourceTile("凤凰美食街套餐","团购")]:tab==="发现"?[...data.works.map(tile),tile(guides[2]),tile(guides[1])]:[...data.works.map(tile),tile(guides[1]),resourceTile("牛香十里潮汕牛肉火锅","团购"),resourceTile("杭州西湖景区","景点百科"),tile(guides[2]),tile(sample)]).join("")}</div>`)+navigation()}
function category(){const samples=[[sample,guides[2],guides[1]],[guides[1],sample],[sample],[sample,guides[2]],[guides[2],guides[1]],[guides[1]]];return header(page.cat)+main(`<div class="grid">${samples[cats.indexOf(page.cat)].map(tile).join("")}</div>`)}
function map(t,day,large=false,inModal=false){
 const stops=t.days[day]||[];
 const referenceMap=stops.map(s=>s.i).join()==="0,1,2";
 return `<div class="map" style="${large?"height:250px":""}">${referenceMap?image("mapref","route-reference"):`<canvas width="700" height="${large?360:210}" data-map="${esc(JSON.stringify(stops.map(stopName)))}" aria-label="路线示意图"></canvas>`}${large?"":btn("⛶ 查看大图",()=>{const old=modal;sheet("路线地图",()=>map(t,day,true,true),{closeFn:()=>{modal=old;renderModal()}})},"",inModal)}</div>`;
}
function photos(r){return r.photos?.length?`<div class="photogrid">${r.photos.map(recordPhoto).join("")}</div>`:""}
function recordCard(r,priv=false,commercial=false){return `<article class="box pink"><h3>${esc(r.title||"旅行记录")}</h3><p>${esc(r.body)}</p>${photos(r)}${(priv||commercial)?(r.links||[]).map(l=>btn(esc(l)+" ›",()=>native(l),"res")).join(""):""}${priv?`<small>${esc(r.visibility)} ${r.draft?"· 草稿":""}</small>`:""}</article>`}
function publicPage(){const t=page.trip,d=page.day||0;if(t.single)return header("地点测评")+main(`${coverVisual(t,"widepic")}<h2>${esc(t.title)}</h2><p>地点 · ${esc(t.spot)}</p><p>${esc(t.copy)}</p>${t.records.map(r=>recordCard(r,false,true)).join("")}`)+(page.preview?foot(btn("返回发布设置",pop,"btn")):"");return `<header class="author">${btn("‹",back,"back",false,'aria-label="返回"')}${image("avatar","avatar","头像")}<b>${byline(t)}</b>${btn(page.follow?"已关注":"关注",()=>set("follow",!page.follow),"btn")}${btn("搜索",()=>native("抖音原生搜索"))}</header>`+main(`<small>行程攻略</small><h1>${esc(t.title)}</h1><p>${esc(t.city)} · ${t.days.length} 天 · ${allStops(t).length} 站</p>${t.copy?`<p>${esc(t.copy)}</p>`:""}<div class="box"><h3>行程概览</h3><div class="overview"><div><small>${t.days.length} 天行程</small><br><small>${allStops(t).length} 个地点</small><br><small>约 ${t.days.reduce((n,day)=>n+day.slice(1).reduce((v,x,i)=>v+legInfo(day[i],x).base,0),0).toFixed(1)} 公里</small></div>${map(t,d)}</div></div>${t.records.filter(r=>!r.stop).map(r=>recordCard(r,false,true)).join("")}${dayTabs(t,d,i=>set("day",i))}${timeline(t,d,"public")}`)+(page.preview?foot(btn("返回发布设置",pop,"btn")):foot(btn("评论",()=>native("评论")),btn(data.likes[t.id]?"已赞":"点赞",()=>toggle("likes",t.id)),btn(data.favorites[t.id]?"已收藏":"收藏",()=>toggle("favorites",t.id)),btn("分享",()=>native("分享")),btn("跟着玩",()=>copySheet(t),"btn primary")))}
let failNextWrite=false,failNextExternal=false;
function setupReview(){const clear=msg=>{$("testStatus").textContent=msg};$("failWrite").onclick=()=>{failNextWrite=true;clear("已设置。下一次保存或发布会失败一次。")};$("failOpen").onclick=()=>{failNextExternal=true;clear("已设置。下一次打开原生页面会失败一次。")}}
function native(title){if(failNextExternal){failNextExternal=false;$("testStatus").textContent="已模拟外部跳转失败，可以重试。";toast("此资源暂时无法打开，请稍后重试");return}if(title==="朋友"||title==="消息"){toast("原生入口占位");return}go("native",{title})}
function commit(update){if(failNextWrite){failNextWrite=false;$("testStatus").textContent="已模拟保存失败，可以重试。";toast("本地保存失败，内容保留在当前页面，请重试");return false}const prev=clone(data);try{update();localStorage.setItem(storeKey,JSON.stringify(data));return true}catch{data=prev;toast("本地保存失败，内容保留在当前页面，请重试");return false}}
function copySheet(t){function copy(){const c=trip(t.title,true);c.city=t.city;c.cover=t.id===sample.id?"tower":t.cover;c.date=t.date||"";c.prep=[];c.days=t.days.map(day=>{const seq=day.map(s=>({...makeStop(s.i,s.time),stay:s.stay,cost:s.cost}));seq.slice(0,-1).forEach((s,i)=>s.links[seq[i+1].id]=legInfo(day[i],day[i+1]).mode);return seq});return c}const add=date=>{if(!date)return toast("请选择出发日期");const c=copy();c.date=date;if(commit(()=>updateTrip(c))){close();openPrivate(c);toast("已加入待出发")}};sheet("跟着玩",()=>`<p>${esc(t.title)} · ${t.days.length} 天 · ${allStops(t).length} 站</p><p>复制路线、地点顺序与交通参考。</p><div class="stack">${primary("直接加入待出发",()=>t.date?add(t.date):sheet("补充出发日期",()=>`<label>出发日期 <input id="copydate" type="date"></label>${primary("加入待出发",()=>add($("copydate").value),true)}`,{closeFn:()=>copySheet(t)}),true)}${btn("编辑后加入",()=>startEdit(copy(),true),"btn",true)}</div>`)}
function confirmBox(title,body,label,fn,cancel=close){sheet(title,()=>`<p>${esc(body)}</p><div class="row">${btn(title.includes("发布")?"返回检查":"取消",cancel,"btn grow",true)}${btn(esc(label),()=>{close();fn()},"btn primary grow",true)}</div>`,{closeFn:cancel,center:true})}
function merged(){const t=clone(edit),live=data.trips.find(x=>x.id===t.id);t.status=original?(live?.status||original.status):"待出发";if(original&&live){t.prep=clone(live.prep);t.records=clone(live.records);const ids=new Set(allStops(t).map(s=>s.id));t.records.forEach(r=>{if(!ids.has(r.stop))r.stop=""})}return t}
function conflicts(t){const mins=s=>{const [h,m]=s.split(":").map(Number);return h*60+m};return t.days.some(day=>day.slice(1).some((s,i)=>{const a=day[i],l=legInfo(a,s);return a.time&&s.time&&mins(s.time)<mins(a.time)+Number(a.stay)+l.mins[l.mode]}))}
function finishEdit(){if(!edit.title.trim()||!edit.city.trim()||!edit.date)return toast("请补全标题、目的地和出发日期");if(!allStops(edit).length)return toast("至少添加一个地点");if(allStops(edit).some(s=>!s.time))return toast("请完善地点的预计到达时间");const t=merged();const submit=()=>{if(!commit(()=>{updateTrip(t);delete data.edits[t.id]}))return;leaveEditor(t);toast(conflicts(t)?"已保存，请检查时间冲突":"已保存行程")};if(original&&data.edits[t.id]&&editOrigin!=="draft")sheet("完成编辑并删除旧草稿？",()=>`${btn("返回检查",close,"btn",true)} ${primary("完成编辑并删除旧草稿",submit,true)}`);else submit()}
function saveEditDraft(){if(!original){const t=clone(edit);t.status="草稿";if(commit(()=>updateTrip(t)))replace("list",{filter:"草稿"});return}const stash=()=>{if(commit(()=>{data.edits[edit.id]=clone(edit)}))leaveEditor(original)};sheet("保存编辑进度",()=>`<div class="stack">${btn("保存到原行程",()=>{const t=merged();if(commit(()=>updateTrip(t)))leaveEditor(t)},"btn",true)}${btn("另存为编辑草稿",()=>{if(editOrigin!=="draft"&&data.edits[edit.id])confirmBox("覆盖旧草稿？","当前路线将替换附属草稿。","覆盖旧草稿",stash);else stash()},"btn",true)}${btn("取消",close,"btn",true)}</div>`)}
function complete(t){if(!allStops(t).length)return toast("至少添加一个地点后才能完成行程");confirmBox(t.status==="进行中"?"结束行程？":"标记为已完成？","完成后可补充记录、发布完整攻略或地点测评。","确认完成",()=>{if(commit(()=>{t.status="已完成"}))rerender()})}
function chooseType(t){if(t.status!=="已完成")return;if(!allStops(t).length)return toast("请先添加至少一个地点");sheet("发布作品",()=>`<div class="stack">${btn("完整行程攻略",()=>startPub(t,false),"btn",true)}${btn("单个地点测评",()=>startPub(t,true),"btn",true)}</div>`)}
function selectedRecords(){const current=data.trips.find(t=>t.id===pub.trip.id);const eligible=new Set((current?.records||[]).filter(r=>!r.draft&&r.visibility==="公开").map(r=>r.id));return pub.selected.map(k=>pubRecords().find(r=>r.id===k)).filter(r=>r&&eligible.has(r.id))}
function saveWorkDraft(){if(!commit(()=>{data.drafts=data.drafts.filter(d=>d.id!==pub.id);data.drafts.unshift(clone(pub))}))return;pop();toast("已保存作品草稿")}
function publishWork(){if(!allStops(pub.trip).length||pub.single&&!pub.spot)return toast("请先选择地点");const t=workSnapshot();if(!commit(()=>{if(!data.works.some(w=>w.id===pub.id))data.works.unshift(t);data.drafts=data.drafts.filter(d=>d.id!==pub.id)}))return;replace("public",{trip:t,day:0});toast("作品已发布到演示主页")}
function pubPhoto(t,cls){return coverVisual(t,cls||"poster")}
function savedTiles(){return catalogue().filter(t=>data.favorites[t.id]).map(tile).join("")||"<p>暂无收藏作品</p>"}
function previewRoute(d){const legs=edit.days.flatMap(day=>day.slice(1).map((s,i)=>legInfo(day[i],s)));sheet("路线预览",()=>`${map(edit,d,false,true)}<p>${edit.days.length} 天 · ${allStops(edit).length} 站 · 约 ${legs.reduce((n,l)=>n+l.base,0).toFixed(1)} km · ${legs.reduce((n,l)=>n+l.mins[l.mode],0)} 分钟</p><small>交通图例　${modes.join("／")}</small>${dayTabs(edit,d,previewRoute,null,true)}<details open><summary>第 ${d+1} 天地点与交通</summary>${timeline(edit,d,"preview",true)}</details>`)}
function reference(pic,w,h,items,cls="",m=false){if(pic==="editstatus")return status()+header("编辑行程",btn("编辑信息",()=>document.querySelector("#edit-title").focus()));if(pic==="recordstatus")return status()+header("旅行记录");if(pic==="searchstatus")return status();if(pic==="profilehead"){const on=(k,cl="")=>{const item=items.find(i=>i[4]===k);return btn(k,item[5],cl)};return status()+`<div class="prof"><div class="profcover">${image("sunset","profp","个人主页封面")}<div class="profactions">${["添加好友","新访客","搜索","菜单"].map(k=>on(k)).join("")}</div><div class="identity">${image("avatar","avatar","头像")}<div><b>旅行小鹿</b><br><small>抖音号 · 个人资料</small></div></div></div><div class="stats"><small>获赞　 互关　 关注　 粉丝</small>${btn("编辑主页",()=>native("编辑主页"),"btn")}</div><small>个人简介 · 所在地</small><div class="profmenu">${items.filter(i=>i[1]===72).map(i=>btn(i[4],i[5])).join("")}</div><div class="stats"><small>记录我的旅行生活</small>${on("去发布","btn")}</div></div>`}return `<div class="stack">${items.map(i=>btn(esc(i[4]),i[5],"btn",m)).join("")}</div>`}
function saveRecord(draft){if(!draft&&!rec.body.trim()&&!rec.photos.length)return toast("请填写旅行体验或添加照片");const t=getTrip(),r={...clone(rec),draft};if(!commit(()=>{const i=t.records.findIndex(x=>x.id===r.id);if(i<0)t.records.push(r);else t.records[i]=r}))return;close();pop();toast(draft?"已保存记录草稿":"已保存记录")}
function render(){setupReview();actions=[];const views={feed:feedWire,create:createPage,channel,category,search,edit:editor,list:listPage,private:privatePage,public:publicPage,record:recordPage,publish:publishPage,profile,workDrafts,native:nativePage};$("app").dataset.page=page.name;$("app").innerHTML=(["list","private","public","publish","workDrafts","native","category"].includes(page.name)?status():"")+views[page.name]();if($("loc"))$("loc").onchange=e=>{page.loc=e.target.value;page.query="";render()};$("where").textContent=labels[page.name];$("help").textContent=notes[page.name];renderModal()}



function search(){const q=(page.query||"").trim(),cat=page.cat||"综合",loc=page.loc||"八佰伴",center={"八佰伴":5,"镜湖公园":6,"芜湖":0}[loc];const pool=places.map((p,i)=>({p,i,dist:.1+Math.abs(i-center)*.6}));const near=pool.slice(0,8).sort((a,b)=>a.dist-b.dist);const exact=q?pool.filter(x=>x.p[0].includes(q)):[];const specific=q&&!["芜湖八佰伴",loc].includes(q);const matching=catalogue().filter(t=>!page.adding&&(!q||(t.title+t.city).includes(q)));const cards=xs=>xs.map(({p,i,dist})=>`<div class="row line">${btn(image(p[1],"thumb","地点图"),()=>native(p[0]))}<div class="grow"><b>${esc(p[0])}</b><br><small>${p[2]} · 距${esc(loc)} ${dist.toFixed(1)} km</small></div>${btn(data.favorites["p"+i]?"★":"☆",()=>toggle("favorites","p"+i))}${btn("＋加入行程",()=>{if(page.adding){pop();addStop(i)}else sheet("加入行程",()=>`<div class="stack">${data.trips.filter(t=>t.status!=="草稿").map(t=>btn(esc(t.title),()=>{startEdit(t);addStop(i)},"btn",true)).join("")}${btn("新建行程",()=>{startEdit();addStop(i)},"btn",true)}</div>`)},"badge")}</div>`).join("");
return status()+main(`<div class="row">${btn("‹",back,"back",false,'aria-label="返回"')}<select id="loc" aria-label="定位">${["八佰伴","镜湖公园","芜湖"].map(s=>`<option ${s===loc?"selected":""}>${s}</option>`).join("")}</select><form class="row grow" id="search-form"><input class="grow" name="query" value="${esc(q)}" placeholder="搜索行程、景点、城市"><button>搜索</button></form></div>${tabs(["综合","景点","美食","商场","酒店","玩乐"],cat,x=>set("cat",x))}${cat==="综合"?`${cards(exact)}${matching.map(t=>btn("行程作品 · "+esc(t.title),()=>go("feed",{trip:t}),"res")).join("")}${specific?exact.length||matching.length?"":'<div class="empty">没有找到匹配结果</div>':`<div class="box"><h3>猜你喜欢</h3><p>围绕${loc}的地点</p><div class="terms">${["附近好玩","美食","餐厅","周边景点","商场","亲子游玩"].map((v,i)=>btn(loc+v,()=>set("cat",["景点","美食","美食","景点","商场","玩乐"][i]),"badge")).join("")}</div></div>${["景点","美食"].map(c=>`<h3>附近的${c}</h3>${cards(near.filter(x=>x.p[2]===c))}`).join("")}`}`:cards((specific?exact:near).filter(x=>x.p[2]===cat))||'<div class="empty">没有匹配的地点</div>'}`)}


render();
</script></body></html>
